[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc", "aarch64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Pull requests never run the release workflow (it holds a write token).
pr-run-mode = "skip"
# Signed build provenance for the archives.
github-attestations = true
# ort's prebuilt ONNX Runtime links the dynamic MSVC runtime; a static CRT leaves its symbols unresolved.
msvc-crt-static = false
# ort's prebuilt ONNX Runtime needs glibc 2.39 or newer, so Linux builds run on Ubuntu 24.04.
[dist.github-custom-runners]
x86_64-unknown-linux-gnu = "ubuntu-24.04"
aarch64-unknown-linux-gnu = "ubuntu-24.04-arm"
aarch64-pc-windows-msvc = "windows-11-arm"
