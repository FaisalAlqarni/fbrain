[package]
name = "fbrain-bench"
version = "0.1.0"
edition = "2021"
description = "Benchmark runner for fbrain search (developer tool, not released)"
publish = false

[package.metadata.dist]
dist = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fbrain = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"
predicates = "3"
serde_json = { version = "1", features = ["preserve_order"] }
